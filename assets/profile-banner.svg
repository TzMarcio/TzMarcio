<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Márcio Lima — Engenheiro de Software</title>
  <desc id="desc">Capa azul escura com detalhes em verde água. APIs, sistemas corporativos, web e mobile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
